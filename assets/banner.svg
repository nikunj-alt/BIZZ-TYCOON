<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GASTECT IoT Gas Leak &amp; Fire Detection System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A13"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00D4C8"/>
    </linearGradient>
    <linearGradient id="lineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#00D4C8"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4C8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00D4C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3D00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#12233A" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 84 H1200 M0 168 H1200 M0 252 H1200 M0 336 H1200"/>
    <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420"/>
  </g>

  <!-- glow orbs -->
  <circle cx="1040" cy="80" r="180" fill="url(#orb)" filter="url(#soft)"/>
  <circle cx="80" cy="360" r="160" fill="url(#orb2)" filter="url(#soft)"/>

  <!-- divider between art and text -->
  <line x1="330" y1="70" x2="330" y2="350" stroke="#1D3450" stroke-width="1"/>

  <!-- ==================== LOGO ART ==================== -->
  <!-- hexagon frame -->
  <g transform="translate(170,195)">
    <polygon points="0,-95 82.3,-47.5 82.3,47.5 0,95 -82.3,47.5 -82.3,-47.5"
             fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.85"/>
    <polygon points="0,-88 76.2,-44 76.2,44 0,88 -76.2,44 -76.2,-44"
             fill="#0A1220" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35"/>
    <!-- telemetry line chart inside -->
    <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-50 42 L-34 30 L-20 36 L-6 18 L8 26 L22 8 L34 16 L48 -6"
            stroke="url(#lineg)"/>
    </g>
    <!-- pulsing endpoint dot -->
    <circle cx="48" cy="-6" r="5.5" fill="#00E676"/>
    <circle cx="48" cy="-6" r="11" fill="none" stroke="#00E676" stroke-opacity="0.6" stroke-width="2">
      <animate attributeName="r" values="8;16;8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- mini status dots under chart -->
    <circle cx="-40" cy="62" r="5" fill="#00E676"/>
    <circle cx="-22" cy="62" r="5" fill="#FFD600"/>
    <circle cx="-4"  cy="62" r="5" fill="#FF3D00"/>
  </g>

  <!-- ==================== TEXT ==================== -->
  <text x="390" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="72"
        font-weight="800" fill="#F2F7FF" letter-spacing="1">
    GASTECT
  </text>

  <text x="392" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="24"
        font-weight="600" fill="url(#accent)" letter-spacing="6">
    IOT GAS LEAK &amp; FIRE DETECTION
  </text>

  <text x="392" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="17"
        fill="#8FA6C8" letter-spacing="0.3">
    Real-time telemetry · Three-tier alerting · Immersive 3D dashboard
  </text>

  <!-- stack pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="390" y="260" width="118" height="34" rx="17" fill="#0D1B30" stroke="#1D3450" stroke-width="1"/>
      <text x="449" y="282" text-anchor="middle" fill="#9FD0FF">Arduino</text>
    </g>
    <g>
      <rect x="518" y="260" width="140" height="34" rx="17" fill="#0D1B30" stroke="#1D3450" stroke-width="1"/>
      <text x="588" y="282" text-anchor="middle" fill="#9FD0FF">Python Bridge</text>
    </g>
    <g>
      <rect x="668" y="260" width="196" height="34" rx="17" fill="#0D1B30" stroke="#1D3450" stroke-width="1"/>
      <text x="766" y="282" text-anchor="middle" fill="#9FD0FF">Next.js 3D Dashboard</text>
    </g>
    <g>
      <rect x="874" y="260" width="116" height="34" rx="17" fill="#0D1B30" stroke="#1D3450" stroke-width="1"/>
      <text x="932" y="282" text-anchor="middle" fill="#9FD0FF">SQLite</text>
    </g>
  </g>

  <!-- competition ribbon -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="390" y="312" width="330" height="34" rx="17" fill="#FFD600" fill-opacity="0.12" stroke="#FFD600" stroke-opacity="0.5" stroke-width="1"/>
    <text x="555" y="334" text-anchor="middle" fill="#FFD600">🏆 BIZZ TYCOONS 2026</text>
  </g>
</svg>
