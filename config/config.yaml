serial:
  port: "COM3"
  baud_rate: 9600

# Alert thresholds per sensor.
#   safe:   below this value the sensor is SAFE
#   warning: at or above this value the sensor is in DANGER
# The range between ``safe`` and ``warning`` is WARNING.
alerts:
  gas:
    safe: 200
    warning: 500
  flame:
    safe: 200
    warning: 400

websocket:
  port: 8765
